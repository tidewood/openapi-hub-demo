openapi: 3.0.3
info: { title: 订单服务, version: 2.1.0, description: 订单域接口。支持多标签分组。 }
servers:
  - url: https://jsonplaceholder.typicode.com
    description: 公共假数据
tags:
  - name: 订单
    description: 订单读写
  - name: 结算
paths:
  /posts:
    get:
      tags: [订单]
      summary: 订单列表
      parameters:
        - { name: _limit, in: query, schema: { type: integer, default: 5 } }
      responses:
        "200":
          description: list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      tags: [订单]
      summary: 创建订单
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201": { description: created }
  /posts/{id}/comments:
    get:
      tags: [结算]
      summary: 订单备注
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: remarks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Remark" }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, description: 订单标题 }
        body: { type: string }
        userId: { type: integer }
    OrderInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: 新订单 }
        body: { type: string }
        userId: { type: integer, example: 1 }
    Remark:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        body: { type: string }
