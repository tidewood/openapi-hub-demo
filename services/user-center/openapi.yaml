openapi: 3.0.3
info:
  title: 用户中心
  version: 3.2.0
  description: |
    用户域接口。包含跨文件引用(`./team.yaml`)与循环引用。
servers:
  - url: https://jsonplaceholder.typicode.com
tags:
  - name: 用户
  - name: 认证
paths:
  /users:
    get:
      tags: [用户]
      summary: 用户列表
      parameters:
        - { name: _limit, in: query, schema: { type: integer, default: 3 } }
      responses:
        "200":
          description: users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      tags: [认证]
      summary: 注册
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201": { description: ok }
  /users/{id}:
    get:
      tags: [用户]
      summary: 用户详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404":
          description: missing
components:
  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string, example: Ling }
        username: { type: string }
        email: { type: string, format: email }
        team: { $ref: "./team.yaml#/components/schemas/Team" }
    UserInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string, example: 新用户 }
        email: { type: string, format: email, example: new@example.com }
        username: { type: string }
